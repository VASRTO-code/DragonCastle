    <link rel="stylesheet" href="./style/style-admen.css">
    <link rel="stylesheet" href="./style/responsive.css">
</head>
<body>

    <div class="scene">
        <div class="cube cube-one"></div>
        <div class="cube cube-two"></div>
        <div class="cube cube-three"></div>
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="grid"></div>
    </div>

    <main class="container">
        <section class="profile-card" id="profileCard">

            <div class="profile-info">
                <div class="logo"><i class="fa-solid fa-dragon"></i><span>DragonCastle</span></div>
                    <p class="step">ADMIN REGISTRATION • 01</p>
                        <h1>Complete Your <span>Admin Profile</span></h1>
                    <p class="description">Your account is ready. Now create your identity inside DragonCastle.</p>

                    <div class="orb">
                        <div class="orb-core"></div>
                        <div class="orb-ring ring-one"></div>
                        <div class="orb-ring ring-two"></div>
                        <div class="orb-ring ring-three"></div>
                    </div>
                </div>

                <div class="form-container">
                    <form id="adminForm">

                        <div class="input-box">
                            <label for="displayName"><i class="fa-solid fa-user"></i>Display Name</label>
                            <input type="text" id="displayName" placeholder="Enter your name" required>
                        </div>

                        <div class="input-box">
                            <label for="job"><i class="fa-solid fa-code"></i>Your Role</label>
                            <select id="job" required>
                                <option value="" disabled selected>Select your role</option>
                                <option>Frontend Developer</option>
                                <option>Backend Developer</option>
                                <option>Full Stack Developer</option>
                                <option>UI/UX Designer</option>
                                <option>Graphic Designer</option>
                                <option>Cyber Security</option>
                                <option>Data Analyst</option>
                                <option>Project Manager</option>
                            </select>
                        </div>

                        <div class="input-box">
                            <label><i class="fa-solid fa-chart-simple"></i>Experience Level</label>
                            <div class="levels">

                                <label class="level">
                                    <input type="radio" name="level" value="Beginner" required>
                                    <span><strong>01</strong>Beginner</span>
                                </label>

                                <label class="level">
                                    <input type="radio" name="level" value="Intermediate">
                                    <span><strong>02</strong>Intermediate</span>
                                </label>

                                <label class="level">
                                    <input type="radio" name="level" value="Advanced">
                                    <span><strong>03</strong>Advanced</span>
                                </label>

                            </div>
                        </div>

                        <div class="input-box">
                            <label for="country"><i class="fa-solid fa-earth-americas"></i>Country</label>
                            <select id="country" required>
                                <option value="" disabled selected>Select your country</option>
                                <option>Egypt</option>
                                <option>Germany</option>
                                <option>Italy</option>
                                <option>France</option>
                                <option>United Kingdom</option>
                                <option>United States</option>
                                <option>Canada</option>
                                <option>Spain</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="input-box">
                            <label for="birth"><i class="fa-solid fa-cake-candles"></i>Date of Birth <span class="required">*</span></label>
                            <input type="date" id="birth" required>
                        </div>

                        <div class="input-box">
                            <label for="cv"><i class="fa-solid fa-file-pdf"></i>Upload CV</label>
                            <div class="upload">
                                <input type="file" id="cv" accept=".pdf,.doc,.docx">
                                <label for="cv">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span id="fileText">Choose your CV</span>
                                <small>PDF / DOC / DOCX</small>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="create-btn">
                            <span>Create Admin Profile</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>

                        <p class="security"><i class="fa-solid fa-shield-halved"></i>Your profile information is protected</p>

                    </form>
                </div>

        </section>
    </main>

    <div class="success" id="success">
        <div class="success-box">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <h2>Profile Created</h2>
            <p>Welcome to DragonCastle, Admin.</p>
        </div>
    </div>

<script src="main.js"></script>
</body>
</html>
