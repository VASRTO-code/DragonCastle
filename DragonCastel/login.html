<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DragonCastle | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech&family=Sekuya&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech&family=Sekuya&display=swap");

/* Variables */
:root{
--bg-main:#050509;
--bg-secondary:#10070A;
--red:#C1121F;
--red-light:#ff2638;
--blue:#3B82F6;
--text:#ffffff;
--text-muted:#929292;
--font-logo:"Sekuya",system-ui;
--font-heading:"Audiowide",sans-serif;
--font-text:"Share Tech",sans-serif;
}

/* Reset */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
font-family:var(--font-text);
background:var(--bg-main);
color:var(--text);
overflow:hidden;
}

/* Background */
.auth-page{
position:relative;
width:100%;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 15% 50%,rgba(193,18,31,.18),transparent 30%),
radial-gradient(circle at 85% 50%,rgba(59,130,246,.08),transparent 30%),
linear-gradient(135deg,#050509,#10070A,#050509);
}

.auth-page::before{
content:"";
position:absolute;
width:500px;
height:500px;
border:1px solid rgba(193,18,31,.15);
border-radius:50%;
box-shadow:0 0 100px rgba(193,18,31,.08);
animation:rotate 20s linear infinite;
}

.auth-page::after{
content:"";
position:absolute;
width:700px;
height:700px;
border:1px solid rgba(59,130,246,.05);
border-radius:50%;
animation:rotateReverse 30s linear infinite;
}

/* Auth Box */
.auth-box{
position:relative;
z-index:2;
width:900px;
height:560px;
display:flex;
overflow:hidden;
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
background:rgba(10,10,15,.82);
backdrop-filter:blur(20px);
box-shadow:
0 0 50px rgba(193,18,31,.12),
inset 0 0 40px rgba(255,255,255,.02);
}

/* Brand */
.auth-brand{
width:42%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:40px;
text-align:center;
background:
linear-gradient(145deg,rgba(193,18,31,.18),rgba(5,5,9,.5));
border-right:1px solid rgba(255,255,255,.08);
}

.dragon-symbol{
font-size:75px;
filter:drop-shadow(0 0 20px rgba(193,18,31,.7));
animation:dragonFloat 3s ease-in-out infinite;
}

.auth-brand h1{
margin-top:25px;
font-family:var(--font-logo);
font-size:30px;
color:#fff;
text-shadow:0 0 20px rgba(193,18,31,.6);
}

.auth-brand p{
margin-top:15px;
max-width:230px;
color:var(--text-muted);
font-size:16px;
line-height:1.5;
}

/* Form Area */
.form-area{
position:relative;
width:58%;
height:100%;
overflow:hidden;
}

/* Forms */
.auth-form{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
padding:55px 60px;
transition:
transform .7s cubic-bezier(.77,0,.18,1),
opacity .5s ease;
}

.login-form{
transform:translateX(0);
opacity:1;
}

.signup-form{
transform:translateX(100%);
opacity:0;
}

.auth-box.signup-active .login-form{
transform:translateX(-100%);
opacity:0;
}

.auth-box.signup-active .signup-form{
transform:translateX(0);
opacity:1;
}

/* Signup Form */
.signup-form{
padding-top:45px;
padding-bottom:45px;
}

/* Typography */
.form-tag{
font-family:var(--font-heading);
font-size:11px;
letter-spacing:3px;
color:var(--red-light);
margin-bottom:10px;
}

.auth-form h2{
font-family:var(--font-heading);
font-size:38px;
margin-bottom:8px;
}

.auth-form>p{
color:var(--text-muted);
margin-bottom:24px;
font-size:15px;
line-height:1.4;
}

/* Inputs */
.input-box{
position:relative;
margin-bottom:14px;
}

.input-box input{
width:100%;
height:52px;
padding:0 18px;
border:1px solid rgba(255,255,255,.1);
border-radius:10px;
outline:none;
background:rgba(255,255,255,.035);
color:#fff;
font-family:var(--font-text);
font-size:16px;
transition:.3s;
}

.input-box input::placeholder{
color:#666;
}

.input-box input:focus{
border-color:var(--red);
box-shadow:0 0 15px rgba(193,18,31,.2);
background:rgba(193,18,31,.04);
}

/* Signup Inputs */
.signup-form .input-box{
margin-bottom:11px;
}

.signup-form .input-box input{
height:49px;
}

/* Options */
.form-options{
display:flex;
align-items:center;
justify-content:space-between;
margin:5px 0 22px;
font-size:13px;
color:var(--text-muted);
}

.form-options label{
display:flex;
align-items:center;
gap:7px;
}

.form-options input{
accent-color:var(--red);
}

.form-options a{
color:var(--red-light);
text-decoration:none;
transition:.3s;
}

.form-options a:hover{
text-shadow:0 0 10px var(--red-light);
}

/* Main Button */
.main-btn{
width:100%;
height:54px;
border:1px solid var(--red);
border-radius:10px;
background:linear-gradient(135deg,var(--red),#780b13);
color:#fff;
font-family:var(--font-heading);
font-size:12px;
letter-spacing:1px;
cursor:pointer;
box-shadow:0 0 20px rgba(193,18,31,.2);
transition:.3s;
}

.main-btn:hover{
transform:translateY(-3px);
box-shadow:0 0 30px rgba(193,18,31,.5);
background:linear-gradient(135deg,#e21b2b,#9b101a);
}

/* Switch Text */
.switch-text{
margin-top:20px!important;
margin-bottom:0!important;
text-align:center;
font-size:14px!important;
color:var(--text-muted);
}

.switch-text button{
display:inline-block;
margin-left:5px;
padding:6px 12px;
border:1px solid rgba(193,18,31,.5);
border-radius:6px;
background:rgba(193,18,31,.08);
color:var(--red-light);
font-family:var(--font-text);
font-size:15px;
cursor:pointer;
transition:.3s;
}

.switch-text button:hover{
background:var(--red);
color:#fff;
box-shadow:0 0 15px rgba(193,18,31,.4);
transform:translateY(-2px);
}

/* Signup Switch */
.signup-form .switch-text{
margin-top:17px!important;
}

/* Animations */
@keyframes dragonFloat{
0%,100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-12px) scale(1.04);
}
}

@keyframes rotate{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

@keyframes rotateReverse{
from{
transform:rotate(360deg);
}
to{
transform:rotate(0deg);
}
}

/* Tablet */
@media(max-width:800px){
.auth-box{
width:92%;
height:600px;
}

.auth-brand{
display:none;
}

.form-area{
width:100%;
}

.auth-form{
padding:40px;
}

.signup-form{
padding-top:40px;
padding-bottom:40px;
}
}

/* Mobile */
@media(max-width:450px){
.auth-box{
width:94%;
height:620px;
border-radius:18px;
}

.auth-form{
padding:30px 25px;
}

.auth-form h2{
font-size:30px;
}

.auth-form>p{
font-size:14px;
}

.input-box input{
height:50px;
}

.signup-form .input-box input{
height:47px;
}

.main-btn{
height:52px;
}

.switch-text{
font-size:13px!important;
}

.switch-text button{
font-size:14px;
padding:5px 10px;
}
}
</style>
</head>
<body>
<!-- Auth -->
<main class="auth-page">
<div class="auth-box" id="authBox">
<div class="auth-brand">
<div class="dragon-symbol">🐉</div>
<h1>Dragon Castle</h1>
<p>Enter the realm beyond imagination.</p>
</div>
<div class="form-area">
<form class="auth-form login-form">
<span class="form-tag">WELCOME BACK</span>
<h2>Login</h2>
<p>Enter your credentials to enter the castle.</p>
<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>
<div class="input-box">
<input type="password" placeholder="Password" required>
</div>
<div class="form-options">
<label>
<input type="checkbox">
Remember me
</label>
<a href="#">Forgot Password?</a>
</div>
<button type="submit" class="main-btn">ENTER THE CASTLE</button>
<p class="switch-text">Don't have an account? <button type="button" id="signUpBtn">Create Account</button></p>
</form>
<form class="auth-form signup-form">
<span class="form-tag">JOIN THE REALM</span>
<h2>Sign Up</h2>
<p>Create your DragonCastle account.</p>
<div class="input-box">
<input type="text" placeholder="Username" required>
</div>
<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>
<div class="input-box">
<input type="password" placeholder="Password" required>
</div>
<div class="input-box">
<input type="password" placeholder="Confirm Password" required>
</div>
<button type="submit" class="main-btn">CREATE ACCOUNT</button>
<p class="switch-text">Already have an account? <button type="button" id="signInBtn">Back to Login</button></p>
</form>
</div>
</div>
</main>
<script src="login.js"></script>
<script>
    const authBox=document.getElementById("authBox");
const signUpBtn=document.getElementById("signUpBtn");
const signInBtn=document.getElementById("signInBtn");

signUpBtn.addEventListener("click",()=>{
authBox.classList.add("signup-active");
});

signInBtn.addEventListener("click",()=>{
authBox.classList.remove("signup-active");
});
</script>
</body>
</html>
