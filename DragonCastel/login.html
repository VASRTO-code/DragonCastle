<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>DragonCastle | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
<!-- Auth -->
    <main class="auth-page">
        <div class="auth-box" id="authBox">
            <div class="auth-brand">
                <div class="dragon-symbol">🐉</div>
                    <h1>Dragon Castle</h1>
                    <p>Enter the realm beyond imagination.</p>
                </div>
                <div class="form-area">
                    <form class="auth-form login-form">
                        <span class="form-tag">WELCOME BACK</span>
                        <h2>Login</h2>
                        <p>Enter your credentials to enter the castle.</p>
                            <div class="input-box">
                                <input type="email" placeholder="Email Address" required>
                            </div>
                            <div class="input-box">
                                <input type="password" placeholder="Password" required>
                            </div>
                            <div class="form-options">
                                <label>
                                    <input type="checkbox">
                                        Remember me
                                </label>
                                <a href="#">Forgot Password?</a>
                            </div>
                            <button type="submit" class="main-btn">ENTER THE CASTLE</button>
                            <p class="switch-text">Don't have an account? <button type="button" id="signUpBtn">Create Account</button></p>
                    </form>
                    <form class="auth-form signup-form">
                        <span class="form-tag">JOIN THE REALM</span>
                        <h2>Sign Up</h2>
                        <p>Create your DragonCastle account.</p>
                        <div class="input-box">
                            <input type="text" placeholder="Username" required>
                        </div>
                        <div class="input-box">
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-box">
                            <input type="password" placeholder="Password" required>
                        </div>
                        <div class="input-box">
                            <input type="password" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="main-btn">CREATE ACCOUNT</button>
                        <p class="switch-text">Already have an account? <button type="button" id="signInBtn">Back to Login</button></p>
                    </form>
                </div>
            </div>
        </main>
<script src="login.js"></script>
<script>
    const authBox=document.getElementById("authBox");
const signUpBtn=document.getElementById("signUpBtn");
const signInBtn=document.getElementById("signInBtn");

signUpBtn.addEventListener("click",()=>{
authBox.classList.add("signup-active");
});

signInBtn.addEventListener("click",()=>{
authBox.classList.remove("signup-active");
});
</script>
</body>
</html>
